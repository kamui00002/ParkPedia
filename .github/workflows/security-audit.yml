name: Security Audit

on:
  workflow_dispatch:
  schedule:
    # 毎週月曜日 10:00 JST (01:00 UTC)
    - cron: '0 1 * * 1'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18'
          cache: 'npm'

      - name: Run NPM Audit
        id: audit
        run: |
          npm audit --json > audit-results.json || true
          cat audit-results.json

      - name: Parse Audit Results
        id: parse
        run: |
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' audit-results.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' audit-results.json)
          MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' audit-results.json)
          LOW=$(jq '.metadata.vulnerabilities.low // 0' audit-results.json)
          TOTAL=$(jq '.metadata.vulnerabilities.total // 0' audit-results.json)

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "moderate=$MODERATE" >> $GITHUB_OUTPUT
          echo "low=$LOW" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

      - name: Create Detailed Report
        if: steps.parse.outputs.total > 0
        run: |
          cat > audit-report.md << 'EOF'
          ## 🔒 NPM Security Audit Report

          **Date**: $(date '+%Y-%m-%d %H:%M:%S')
          **Total Vulnerabilities**: ${{ steps.parse.outputs.total }}

          ### Summary

          | Severity | Count |
          |----------|-------|
          | 🔴 Critical | ${{ steps.parse.outputs.critical }} |
          | 🟠 High | ${{ steps.parse.outputs.high }} |
          | 🟡 Moderate | ${{ steps.parse.outputs.moderate }} |
          | 🟢 Low | ${{ steps.parse.outputs.low }} |

          ### Recommended Actions

          > ⚠️ **Do NOT run `npm audit fix --force`.** It bumps `expo` across major
          > SDK versions (e.g. 54 → 57), which breaks the native build. Use targeted
          > `overrides` in `package.json` instead.

          1. **Triage: is it even shipped to users?**
             Most findings here are build-tooling only (Expo CLI / Metro / Detox / ESLint)
             and never enter the app bundle. Confirm before treating it as user-facing:
             ```bash
             npx expo export --platform ios --output-dir /tmp/pp-export
             strings /tmp/pp-export/_expo/static/js/ios/*.hbc | grep -icE '<vulnerable-pkg>'
             ```

          2. **Fix via targeted overrides** (pin inside the *same major*, use `^` not `>=`):
             ```jsonc
             // package.json
             "overrides": {
               "some-pkg": "^1.2.3"   // ^ keeps it in major 1; >= would jump to latest major
             }
             ```
             ```bash
             npm install
             npm ls some-pkg   # npm silently ignores unsatisfiable overrides — verify it took
             ```

          3. **Skip anything needing a major jump.** If several majors of a package
             legitimately coexist in the tree (`ws`, `js-yaml`, `brace-expansion`),
             a blanket override breaks the toolchain. Leave it and note why.

          4. **Verify** (all three must pass):
             ```bash
             npm run typecheck
             npm test                                   # compare against baseline
             npx expo export --platform ios --output-dir /tmp/pp-after   # must succeed
             ```

          5. **Commit**:
             ```bash
             git checkout -b chore/npm-audit-$(date +%Y-%m-%d)
             git add package.json package-lock.json
             git commit -m "fix: Update dependencies to resolve security vulnerabilities"
             git push
             ```

          ### Detailed Findings

          See the full audit results in the workflow artifacts.

          ---

          **Workflow Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - name: Upload Audit Results
        if: steps.parse.outputs.total > 0
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-results-${{ github.run_id }}
          path: |
            audit-results.json
            audit-report.md
          retention-days: 30

      - name: Create or Update Issue
        if: steps.parse.outputs.high > 0 || steps.parse.outputs.critical > 0
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const critical = ${{ steps.parse.outputs.critical }};
            const high = ${{ steps.parse.outputs.high }};
            const moderate = ${{ steps.parse.outputs.moderate }};
            const low = ${{ steps.parse.outputs.low }};

            const title = `🔴 Security: ${critical + high} Critical/High Vulnerabilities Detected`;

            const body = `## 🔒 NPM Security Audit Report

            **Date**: ${new Date().toISOString()}
            **Workflow Run**: ${context.payload.repository.html_url}/actions/runs/${context.runId}

            ### Summary

            | Severity | Count |
            |----------|-------|
            | 🔴 Critical | ${critical} |
            | 🟠 High | ${high} |
            | 🟡 Moderate | ${moderate} |
            | 🟢 Low | ${low} |

            ### ⚠️ Do NOT run \`npm audit fix --force\`

            It bumps \`expo\` across major SDK versions (e.g. 54 → 57), which breaks the
            native build. Use targeted \`overrides\` in \`package.json\` instead.

            ### Step 1 — Triage: is it actually shipped to users?

            Most findings here live in build tooling (Expo CLI / Metro / Detox / ESLint)
            and never enter the app bundle. Confirm before treating this as user-facing:

            \`\`\`bash
            npx expo export --platform ios --output-dir /tmp/pp-export
            strings /tmp/pp-export/_expo/static/js/ios/*.hbc | grep -icE '<vulnerable-pkg>'
            # 0 hits => build tooling only, no user exposure, no patch release needed
            \`\`\`

            ### Step 2 — Fix via targeted overrides

            Pin inside the **same major** — use \`^\`, never \`>=\` (which jumps to the latest major):

            \`\`\`bash
            # package.json -> "overrides": { "some-pkg": "^1.2.3" }
            npm install
            npm ls some-pkg   # npm silently ignores unsatisfiable overrides — verify it took
            \`\`\`

            Skip anything that needs a major jump. When several majors of a package
            legitimately coexist in the tree (\`ws\`, \`js-yaml\`, \`brace-expansion\`,
            \`@grpc/grpc-js\`), a blanket override breaks the toolchain — leave it and note why.

            ### Step 3 — Verify (all three must pass)

            \`\`\`bash
            npm run typecheck
            npm test          # compare against the pre-change baseline, not against zero
            npx expo export --platform ios --output-dir /tmp/pp-after   # must succeed

            git checkout -b chore/npm-audit-$(date +%Y-%m-%d)
            git add package.json package-lock.json
            git commit -m "fix: Resolve ${critical + high} critical/high security vulnerabilities"
            git push
            \`\`\`

            ### Additional Steps

            1. Review the [detailed audit results](${context.payload.repository.html_url}/actions/runs/${context.runId})
            2. Re-run the bundle grep from Step 1 after fixing, to confirm nothing new was pulled in
            3. Update this issue when resolved

            ---

            This issue was automatically created by the Security Audit workflow.
            `;

            // Search for existing open security issues
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,dependencies'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes('Security:') && issue.title.includes('Vulnerabilities')
            );

            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## 🔄 Updated Security Audit\n\n${body}`
              });

              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              // Create new issue
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'dependencies', 'automated']
              });

              console.log(`Created new issue #${newIssue.data.number}`);
            }

      - name: Post Summary
        if: always()
        run: |
          echo "### Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | ${{ steps.parse.outputs.critical }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | ${{ steps.parse.outputs.high }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 Moderate | ${{ steps.parse.outputs.moderate }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 Low | ${{ steps.parse.outputs.low }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.parse.outputs.total }}" -gt "0" ]; then
            echo "⚠️ **Action required**: Review and fix vulnerabilities" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **No vulnerabilities detected**" >> $GITHUB_STEP_SUMMARY
          fi
